services:
  # Internal-only Redis-compatible queue storage for Bull.
  - type: keyvalue
    name: placecampus-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: placecampus-api
    runtime: docker
    plan: free
    region: singapore
    branch: Danish-Dev-2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Keep uploads durable on Render's ephemeral filesystem by using Cloudinary.
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: placecampus-redis
          property: connectionString
