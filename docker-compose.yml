version: '3.9'

services:
  # ─── MongoDB ───────────────────────────────
  mongodb:
    image: mongo:7
    container_name: skillbridge-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: skillbridge
    volumes:
      - mongodb_data:/data/db
    networks:
      - skillbridge-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skillbridge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - skillbridge-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend API ────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: skillbridge-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/skillbridge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AI_API_KEY: ${AI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skillbridge-network

  # ─── Next.js Frontend ─────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: skillbridge-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    networks:
      - skillbridge-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  skillbridge-network:
    driver: bridge
